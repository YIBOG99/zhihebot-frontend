name: Verify storefront

on:
  pull_request:
  push:
    branches:
      - main
      - chore/independent-backend-readiness

permissions:
  contents: read

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # TanStack Router's Vite plugin generates routeTree.gen.ts during the build.
      # Build first so a newly added file route is present before TypeScript checks it.
      - name: Production build
        run: pnpm run build
      - name: TypeScript typecheck
        run: pnpm run typecheck
